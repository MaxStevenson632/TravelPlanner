<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <link href="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.css" rel="stylesheet" />
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.js"></script>

    <link rel = "stylesheet" href = "../style/home.css">
    <script src = "../script/home.js" type = "module" defer> </script>
    <script src = "../script/Map/mapInit.js" type = "module" defer></script>
    <script src = "../script/Map/mapController.js" type = "module" defer> </script>
    <script src = "../script/Map/mapMarkers.js" type = "module" defer> </script>
    <script src = "../script/Map/mapNavigation.js" type = "module" defer> </script>

</head>

<body>

<div id = "sideBarContainer">
    <div class = "sidebarUserName" id = "sidebarUserName"></div>

    <div id = "usernameHeader">
    </div>

    <div class = "tripsHeading">
        <h3>Your trips</h3>
        <button id = "addTripIconBtn" type = "button" aria-label = "Create new trip">+</button>
    </div>

    <ul id = "tripList">
        <li class = "tripListLoading">Loading trips…</li>
        <li class = "tripListItem"></li>
    </ul>

    <div id="tripDetailPanel" class="detail-panel">
        <button class="back-button" id="backToTripsBtn">← Back</button>
        <p class="detail-kicker">Trip Details</p>
        <h2 class="detail-trip-name" id="detailTripName">Loading...</h2>

        <div class="detail-tabs">
            <button class="tab-button is-active" data-target="viewWaypoints">Waypoints</button>
            <button class="tab-button" data-target="viewPeople">People</button>
        </div>

        <div id="viewWaypoints" class="detail-view is-visible">
            <div id="detailWaypointsList">
            </div>

            <button class="expandable-add-btn" id="addWaypointBtn">
                <span class="icon">+</span>
                <span class="text">Add Waypoint</span>
            </button>
        </div>

        <div id="viewPeople" class="detail-view">
            <div class="people-list" id="detailPeopleList">
            </div>

            <button class="expandable-add-btn" id="addPersonBtn">
                <span class="icon">+</span>
                <span class="text">Add Person</span>
            </button>
        </div>
    </div>
</div>

<div id="mapContainer">
    <div id = "map"></div>

    <button id="renderMarkers"> Show markers </button>
    <button id="addTripBtn"> Create New Trip! </button>

    <div id = "tripFormContainer" class = "hidden">
        <h2> Create New Trip </h2>
        <form id = "tripForm">
            <div class = "formGroup">
                <label for = "title"> Trip Title: </label>
                <input type = "text" id = "title" required placeholder = "e.g. London to Berlin 2026">
            </div>

            <div class = "formGroup">
                <label for="waypoints"> Waypoints (comma separated): </label>
                <input type = "text" id = "waypoints" placeholder = "e.g. London, Paris, Berlin">
            </div>

            <div class = "formRow">
                <div class = formGroup>
                    <label for = "startDate"> Start Date: </label>
                    <input type = "date" id = "startDate" required>
                </div>
                <div class = "formGroup">
                    <label for = "endDate"> End Date: </label>
                    <input type = "date" id = "endDate" required>
                </div>
            </div>

            <div class = "formActions">
                <button type = "submit" id = "saveTripBtn"> Create Trip </button>
                <button type = "button" id = "cancelTripBtn"> Cancel Trip </button>
            </div>
        </form>
    </div>

    <div id = "memberSearchOverlay" class = "hidden">
        <div class = "member-search-panel">
            <h2 class = "member-search-heading"> Add a member </h2>
            <div class = "member-search-input-wrap">
                <input
                    type = "text"
                    id = "memberSearchInput"
                    class = "member-search-input"
                    placeholder = "Search by name or email"
                    autocomplete = "off"
                />
            </div>

            <ul class = "member-results-list" id = "memberResultsList"></ul>
            <button class = "member-cancel-btn" id = "memberCancelBtn"> Cancel </button>
        </div>
    </div>

</div>


</body>
</html>
