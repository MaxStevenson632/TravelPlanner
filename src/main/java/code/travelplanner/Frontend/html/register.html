<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">
    <link rel = "stylesheet" href = "../style/LoginRegister.css">
    <script src = "../script/register.js" defer> </script>

</head>

<body>

<div id="authPage">
    <h1> Create new account </h1>

    <input type="text" id="usernameEntry" placeholder="Create your username">
    <input id="passwordEntry" type="password" placeholder="Create your password" />
    <input type="password" id="confirmPassword" placeholder="Confirm password">
    <input id="emailEntry" type="email" placeholder="Enter your email" />

    <button id = "authButton" onclick="registerAccount()">Register account</button>

    <p class = "authLink">
        Already have an account?<a href="/index.html"> Sign in Here</a>
    </p>
</div>
</body>
</html>
